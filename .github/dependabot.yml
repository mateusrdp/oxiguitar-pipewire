# Weekly version updates for the Rust crates and the workflows' actions, as
# pull requests into develop. scripts/check-dco.sh skips Dependabot's commits.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # OxiGuitar's crates (SDK, host, model, test kit, and the shared audio
      # layer oxiguitar-audio-cpal) come from git tags, moved by hand and
      # together (the audio layer first): the SDK tag must be the audio
      # layer's own, or the build sees two Host types. Dependabot reads a
      # tag against the crates' own versions, proposes other tags and fails
      # to resolve them, so it leaves them all alone.
      - dependency-name: "oxiguitar-*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
