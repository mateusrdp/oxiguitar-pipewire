# Test builds and releases (#165). The work is oxiguitar's reusable workflow
# plugin-release.yml: it runs build-oxp.sh on each system and makes a zip per
# target, a .deb and an .rpm (oxiguitar-pipewire), a per-user Windows installer, a macOS
# .pkg and SHA256SUMS.
#
# - On a pull request, and on a push to develop or main: nothing is
#   released. The files stay under the run for 14 days, with a ~dev version;
#   those are the test builds.
# - On a pushed v* tag (only the maintainer makes them; v plus the version in
#   Cargo.toml): a DRAFT release holding all of it. Publishing the draft
#   starts publish.yml.
name: Release

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    uses: mateusrdp/oxiguitar/.github/workflows/plugin-release.yml@99722a630b8bf1d886f74281e092c2399cd38a18
    with:
      name: pipewire
      title: "PipeWire audio"
      description: "Plays OxiGuitar's sound through PipeWire."
      # ci.yml has run the tests on six systems.
      test: false
      systems: linux
      linux-ubuntu: "24.04"
      glibc: "2.39"
      apt-packages: libasound2-dev libpipewire-0.3-dev libclang-dev
      tools-ref: 99722a630b8bf1d886f74281e092c2399cd38a18
    permissions:
      contents: write
